name: Publish Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Date version without dots, for example 20261001
        required: true
        default: "20261001"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian AMD64
            platform: linux/amd64
            dockerfile: Dockerfile.debian
            tag: debian-amd64
          - name: Raspberry Pi ARM64
            platform: linux/arm64
            dockerfile: Dockerfile
            tag: pi-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/oolittlesweetoo/tsl-router:${{ matrix.tag }}-${{ inputs.version }}
            ghcr.io/oolittlesweetoo/tsl-router:${{ matrix.tag }}-latest
          labels: |
            org.opencontainers.image.source=https://github.com/OoLittleSweetoO/tsl-router
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
